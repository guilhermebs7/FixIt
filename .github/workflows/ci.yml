name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest                                      #verifica se o projeto consegue ser preparado e compilado  e executa esse job em uma maquina virtual Ubuntu fornecida pelo GitHub

    env:
      
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/fixit_test?schema=public"           # variável de ambiente necessária para a geração do Prisma no CI

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Validar compilação TypeScript
        run: npm run build